function apiCands(){const l=location,c=[],q=new URLSearchParams(l.search).get('api'),m=document.querySelector('meta[name="api-base"]');let s='';
 try{if(q)localStorage.setItem('api_base',q);s=localStorage.getItem('api_base')||''}catch{}
 [q,window.API_BASE,m&&m.content,s].forEach(x=>x&&c.push(String(x).trim().replace(/\/+$/,'')));
 if(/^https?:$/.test(l.protocol))c.push('');
 [`http://${l.hostname||'localhost'}:3000`,'http://localhost:3000','http://127.0.0.1:3000'].forEach(x=>c.push(x));
 return[...new Set(c)]}
async function probe(b){const ac=new AbortController(),t=setTimeout(()=>ac.abort(),4000);
 try{const j=await(await fetch(b+'/health',{signal:ac.signal,cache:'no-store'})).json();return!!j&&typeof j.dry_run!=='undefined'}catch{return false}finally{clearTimeout(t)}}
function apiBase(){if(API.base!==null)return Promise.resolve(API.base);
 return API.p||(API.p=(async()=>{try{for(const b of apiCands())if(await probe(b)){API.base=b;try{b?localStorage.setItem('api_base',b):localStorage.removeItem('api_base')}catch{}return b}throw new Error('no_server')}finally{API.p=null}})())}
async function api(p,o={}){if(S.demo)return mock(p,o);const r=await fetch(await apiBase()+'/api'+p,{method:o.method||'GET',headers:{'content-type':'application/json',...(S.tok?{authorization:'Bearer '+S.tok}:{})},body:o.body?JSON.stringify(o.body):undefined});
 if(r.status===401&&S.ref&&!o.r&&!p.startsWith('/auth')){const j=await fetch((API.base||'')+'/api/auth/refresh',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({refresh_token:S.ref})});
  if(j.ok){setTok(await j.json());return api(p,{...o,r:1})}logout();throw new Error('unauthorized')}
 if(r.status===405)API.base=null;
 const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.error||r.status),{data:j});return j}
